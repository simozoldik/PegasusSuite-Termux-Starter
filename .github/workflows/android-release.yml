name: Build Pegasus Suite APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets and run checks
        env:
          PEGASUS_API_BASE_URL: ${{ vars.PEGASUS_API_BASE_URL }}
        run: |
          set -euo pipefail
          npm run build
          npm run test:web

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p "$RUNNER_TEMP/pegasus-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pegasus-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/pegasus-signing/release.p12"

          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/pegasus-signing/release.p12" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Recreate Capacitor Android scaffold
        env:
          PEGASUS_VERSION_CODE: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BACKUP="$RUNNER_TEMP/pegasus-gradle-template"
          mkdir -p "$BACKUP/app"

          cp android/build.gradle "$BACKUP/build.gradle"
          cp android/variables.gradle "$BACKUP/variables.gradle"
          cp android/gradle.properties "$BACKUP/gradle.properties"
          cp android/app/build.gradle "$BACKUP/app/build.gradle"
          cp android/app/proguard-rules.pro "$BACKUP/app/proguard-rules.pro"

          rm -rf android
          npx cap add android

          cp "$BACKUP/build.gradle" android/build.gradle
          cp "$BACKUP/variables.gradle" android/variables.gradle
          cp "$BACKUP/gradle.properties" android/gradle.properties
          cp "$BACKUP/app/build.gradle" android/app/build.gradle
          cp "$BACKUP/app/proguard-rules.pro" android/app/proguard-rules.pro

          node scripts/prepare-android-ci.mjs
          npx cap sync android

          chmod +x android/gradlew
          cd android

          echo "=== GENERATED ANDROID APP GRADLE ==="
          nl -ba app/build.gradle | sed -n '1,45p'

          echo "=== GENERATED VARIABLES ==="
          nl -ba variables.gradle | sed -n '1,35p'

          echo "=== GRADLE BUILD ==="
          PEGASUS_KEYSTORE_FILE="$RUNNER_TEMP/pegasus-signing/release.p12" \
          PEGASUS_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          PEGASUS_KEY_ALIAS="$KEY_ALIAS" \
          PEGASUS_KEY_PASSWORD="$KEY_PASSWORD" \
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signed APK
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/Pegasus-Suite-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pegasus-Suite-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/Pegasus-Suite-release.apk
          if-no-files-found: error
          retention-days: 14
